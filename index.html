<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Retro Game</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            height: 100svh;
            background: #000;
        }

        /* Mantiene negra la zona que rodea al juego y los controles */
        #game-container.ejs_parent,
        #game-container .ejs_game,
        #game-container .ejs_canvas_parent {
            background-color: #000 !important;
        }

        /* Botones A y B */
        #game-container .ejs_virtualGamepad_button.b_a,
        #game-container .ejs_virtualGamepad_button.b_b {
            width: 64px !important;
            height: 64px !important;
            line-height: 64px !important;
            border: 2px solid #e9a8b6 !important;
            border-radius: 50% !important;
            background: #b00050 !important;
            color: #fff !important;
            box-shadow:
                inset 2px 2px 0 rgba(255, 255, 255, 0.18),
                0 3px 0 #65002e !important;
        }

        #game-container .ejs_virtualGamepad_button.b_a.ejs_virtualGamepad_button_down,
        #game-container .ejs_virtualGamepad_button.b_b.ejs_virtualGamepad_button_down {
            background: #85003c !important;
            transform: translateY(2px);
        }

        /* Botones L y R */
        #game-container .ejs_virtualGamepad_button.b_l,
        #game-container .ejs_virtualGamepad_button.b_r {
            background: #741b36 !important;
            border: 2px solid #e9a8b6 !important;
            border-radius: 8px !important;
            color: #fff !important;
            box-shadow: 0 3px 0 #421020 !important;
        }

        /* Cruceta */
        #game-container .b_dpad .ejs_dpad_main {
            opacity: 1 !important;
        }

        #game-container .b_dpad .ejs_dpad_bar {
            background: #111321 !important;
            border: 2px solid #777 !important;
            border-radius: 5px;
            box-shadow:
                inset 2px 2px 0 rgba(255, 255, 255, 0.12),
                0 3px 0 #050505 !important;
        }

        /* Select y Start */
        #game-container .ejs_virtualGamepad_button.b_select,
        #game-container .ejs_virtualGamepad_button.b_start {
            width: 70px !important;
            height: 18px !important;
            line-height: 18px !important;
            border: 0 !important;
            border-radius: 20px !important;
            background: #85858a !important;
            color: #fff !important;
            font-size: 12px !important;
            box-shadow: none !important;
            transform: rotate(-24deg);
        }
    </style>
</head>

<body>
    <div id="game-container"></div>

    <script>
        window.EJS_player = "#game-container";
        window.EJS_core = "gba";
        window.EJS_gameUrl = "smb.gba";
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_startOnLoaded = true;
        window.EJS_backgroundColor = "#000000";
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
