<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Retro NFC - Mario</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        /* Carcasa negra detrás de la pantalla y los controles */
        #game-container .ejs_parent,
        #game-container .ejs_game,
        #game-container .ejs_canvas_parent {
            background: #000 !important;
        }

        /* Separación entre la pantalla y la zona de controles */
        #game-container .ejs_virtualGamepad_parent {
            bottom: clamp(140px, 24vh, 340px) !important;
        }

        /* Botones A, B, L y R */
        #game-container .ejs_virtualGamepad_button {
            background: linear-gradient(145deg, #292929, #101010) !important;
            border: 2px solid #777 !important;
            color: #ddd !important;
            box-shadow:
                inset 2px 2px 3px rgba(255, 255, 255, 0.14),
                0 4px 0 #050505 !important;
            text-shadow: 1px 1px 2px #000;
        }

        #game-container .ejs_virtualGamepad_button_down {
            background: #080808 !important;
            transform: translateY(2px);
            box-shadow: inset 0 2px 5px #000 !important;
        }

        /* Cruceta */
        #game-container .ejs_dpad_main {
            opacity: 1 !important;
        }

        #game-container .ejs_dpad_bar {
            background: linear-gradient(145deg, #292929, #101010) !important;
            border: 2px solid #666;
            box-shadow:
                inset 2px 2px 3px rgba(255, 255, 255, 0.12),
                0 4px 0 #050505;
        }

        #game-container .ejs_dpad_horizontal,
        #game-container .ejs_dpad_vertical {
            border-radius: 4px;
            overflow: visible;
        }

        #game-container .ejs_dpad_horizontal:before {
            border-right-color: #080808;
        }

        #game-container .ejs_dpad_horizontal:after {
            border-left-color: #080808;
        }

        #game-container .ejs_dpad_vertical:before {
            border-bottom-color: #080808;
        }

        #game-container .ejs_dpad_vertical:after {
            border-top-color: #080808;
        }
    </style>
</head>

<body>
    <div id="game-container"></div>

    <script>
        window.EJS_player = "#game-container";
        window.EJS_core = "gba";
        window.EJS_gameUrl = "smb.gba";
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_startOnLoaded = true;
    </script>

    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
