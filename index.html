<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Retro Game</title>

    <style>
        :root {
            --shell-color: #c8c9bd;
            --screen-end: min(66.6667vw, 100svh);
            --gap-size: clamp(48px, 7vh, 82px);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            user-select: none;
            -webkit-user-select: none;
        }

        #game-container {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            height: 100svh;
            background: transparent;
        }

        #game-container.ejs_parent,
        #game-container .ejs_game,
        #game-container .ejs_canvas_parent {
            background: transparent !important;
        }

        #game-container::before,
        #game-container::after {
            content: "";
            position: absolute;
            right: 0;
            left: 0;
            z-index: 2;
            pointer-events: none;
        }

        #game-container::before {
            top: var(--screen-end);
            height: var(--gap-size);
            background: #000;
        }

        #game-container::after {
            top: calc(var(--screen-end) + var(--gap-size));
            bottom: 0;
            background: var(--shell-color);
        }

        #game-container .ejs_virtualGamepad_parent {
            z-index: 3 !important;
        }

        #color-picker-toggle {
            position: fixed;
            top: calc(var(--screen-end) + var(--gap-size) + 12px);
            z-index: 1200;
            height: 38px;
            border: 1px solid rgba(17, 19, 33, .24);
            color: #fff;
            background: #292929;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            right: 14px;
            display: grid;
            width: 38px;
            place-items: center;
            padding: 0;
            border-radius: 50%;
        }

        .current-color {
            width: 18px;
            height: 18px;
            border: 1px solid rgba(255, 255, 255, .75);
            border-radius: 50%;
            background: var(--shell-color);
        }

        #color-picker {
            position: fixed;
            top: calc(var(--screen-end) + var(--gap-size) + 58px);
            z-index: 1200;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 8px;
            background: #242424;
        }

        #color-picker[hidden] {
            display: none;
        }

        #color-picker {
            right: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #game-status {
            position: fixed;
            top: 50%;
            left: 50%;
            z-index: 1300;
            max-width: calc(100vw - 40px);
            margin: 0;
            padding: 12px 16px;
            border-radius: 6px;
            color: #fff;
            background: rgba(0, 0, 0, .86);
            font: 12px/1.4 Arial, sans-serif;
            text-align: center;
            transform: translate(-50%, -50%);
        }

        #game-status[hidden] {
            display: none;
        }

        .color-choice {
            width: 22px;
            height: 22px;
            padding: 0;
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 50%;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .color-choice[aria-pressed="true"] {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        /* Botones A y B */
        #game-container .ejs_virtualGamepad_button.b_a,
        #game-container .ejs_virtualGamepad_button.b_b {
            width: 64px !important;
            height: 64px !important;
            line-height: 64px !important;
            border: 2px solid #a97987 !important;
            border-radius: 50% !important;
            background: #a33d65 !important;
            color: #fff !important;
            box-shadow: 0 3px 0 #632b41 !important;
        }

        #game-container .ejs_virtualGamepad_button.b_a.ejs_virtualGamepad_button_down,
        #game-container .ejs_virtualGamepad_button.b_b.ejs_virtualGamepad_button_down {
            background: #85003c !important;
            transform: translateY(2px);
        }

        /* Botones L y R */
        #game-container .ejs_virtualGamepad_button.b_l,
        #game-container .ejs_virtualGamepad_button.b_r {
            border: 2px solid #a97987 !important;
            border-radius: 8px !important;
            background: #762b43 !important;
            color: #fff !important;
            box-shadow: 0 3px 0 #4d192c !important;
        }

        /* Cruceta */
        #game-container .b_dpad .ejs_dpad_main {
            opacity: 1 !important;
        }

        #game-container .b_dpad .ejs_dpad_bar {
            border: 2px solid #777 !important;
            border-radius: 5px;
            background: #111321 !important;
            box-shadow: 0 3px 0 #050505 !important;
        }

        /* Select y Start */
        #game-container .ejs_virtualGamepad_button.b_select,
        #game-container .ejs_virtualGamepad_button.b_start {
            width: 70px !important;
            height: 18px !important;
            line-height: 18px !important;
            border: 0 !important;
            border-radius: 20px !important;
            background: #85858a !important;
            color: #fff !important;
            font-size: 12px !important;
            box-shadow: none !important;
            transform: rotate(-24deg);
        }
    </style>
</head>

<body>
    <div id="game-container"></div>

    <p id="game-status" role="status" hidden></p>

    <button id="color-picker-toggle" type="button" aria-label="Elegir color de carcasa" aria-expanded="false" aria-controls="color-picker" title="Color de carcasa">
        <span class="current-color"></span>
    </button>
    <div id="color-picker" role="group" aria-label="Colores de la carcasa" hidden>
        <button class="color-choice" type="button" data-color="#62799e" aria-label="Azul" aria-pressed="false" title="Azul" style="background:#62799e"></button>
        <button class="color-choice" type="button" data-color="#796b91" aria-label="Morado" aria-pressed="false" title="Morado" style="background:#796b91"></button>
        <button class="color-choice" type="button" data-color="#a55d5c" aria-label="Rojo" aria-pressed="false" title="Rojo" style="background:#a55d5c"></button>
        <button class="color-choice" type="button" data-color="#262626" aria-label="Negro" aria-pressed="false" title="Negro" style="background:#262626"></button>
        <button class="color-choice" type="button" data-color="#a69563" aria-label="Dorado" aria-pressed="false" title="Dorado" style="background:#a69563"></button>
        <button class="color-choice" type="button" data-color="#c8c9bd" aria-label="Gris Game Boy" aria-pressed="true" title="Gris Game Boy" style="background:#c8c9bd"></button>
    </div>

    <script>
        const games = {
            mario: { core: "gba", url: "smb.gba" },
            zelda: { core: "gba", url: "games/zelda-minish-cap.gba" }
        };

        const colorPicker = document.querySelector("#color-picker");
        const colorPickerToggle = document.querySelector("#color-picker-toggle");
        const requestedGameId = new URLSearchParams(location.search).get("game") || "mario";
        const gameStatus = document.querySelector("#game-status");

        colorPickerToggle.addEventListener("click", () => {
            colorPicker.hidden = !colorPicker.hidden;
            colorPickerToggle.setAttribute("aria-expanded", String(!colorPicker.hidden));
        });

        document.querySelectorAll(".color-choice").forEach((button) => {
            button.addEventListener("click", () => {
                document.documentElement.style.setProperty("--shell-color", button.dataset.color);
                document.querySelectorAll(".color-choice").forEach((choice) => {
                    choice.setAttribute("aria-pressed", "false");
                });
                button.setAttribute("aria-pressed", "true");
                colorPickerToggle.querySelector(".current-color").style.backgroundColor = button.dataset.color;
                colorPicker.hidden = true;
                colorPickerToggle.setAttribute("aria-expanded", "false");
            });
        });

        const game = games[requestedGameId] || games.mario;
        window.EJS_player = "#game-container";
        window.EJS_core = game.core;
        window.EJS_gameUrl = game.url;
        window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
        window.EJS_startOnLoaded = true;
        window.EJS_backgroundColor = "#000000";
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
