<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <!-- Etiquetas para adaptación perfecta y modo "App Nativa" -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Retro NFC - Mario</title>
    <style>
        /* Diseño de máximo rendimiento: sin sombras ni bordes que causen lag */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100vw; 
            height: 100vh; 
            background-color: #000; 
            overflow: hidden; 
            /* Evita que el usuario seleccione cosas por error al tocar los botones */
            user-select: none; 
            -webkit-user-select: none;
        }
        #game-container { 
            width: 100vw; 
            height: 100vh; 
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <script>
        window.EJS_player = '#game-container';
        window.EJS_core = 'gba'; 
        window.EJS_gameUrl = 'smb.gba'; 
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_startOnLoaded = true; 
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
